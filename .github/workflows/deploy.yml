name: Build LaTeX and deploy on GitHub Releases
on:
  push:
    tags: '*'
    branches-ignore:
      - 'autodelivery**'
      - 'bump-**'
      - 'renovate/**'
      - 'autobib/**'
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'renovate.json'
  pull_request:
  workflow_dispatch:

jobs:
  success:

    name: Build and publish CV documents
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Compile and publish the CV and full publication list
        uses: DanySK/compile-and-publish-all-latex@2.3.7
        with:
          token: ${{ secrets.TOKEN }}
